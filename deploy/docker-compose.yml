# ──────────────────────────────────────────────────────────────
#  ElevenVoice — Docker Compose
#
#  Quick start:
#    docker compose -f deploy/docker-compose.yml --profile cpu up    # CPU mode
#    docker compose -f deploy/docker-compose.yml --profile gpu up    # NVIDIA GPU
#    docker compose -f deploy/docker-compose.yml --profile rocm up   # AMD GPU (ROCm)
#
#  The Studio services publish the UI on loopback and the authenticated TLS
#
#  First run downloads ~4 GB of models. Progress is shown in logs.
#  Open http://localhost:3900 once the health check passes.
#
#  Images: `:stable` / `:stable-rocm` are the latest tagged release; use
#  `:latest` / `:rocm` to follow the rolling preview built from main.
#
#  SECURITY: The port is bound to 127.0.0.1 by default — only this
#  machine can reach the API. To expose ElevenVoice on your LAN (or
#  through a reverse proxy / tunnel), change the port mapping to
#  "0.0.0.0:3900:3900" or "3900:3900". Export a long random
#  ELEVENVOICE_API_KEY before starting a Studio profile; use HTTPS or an
#  encrypted private overlay whenever traffic leaves a fully trusted LAN.
# ──────────────────────────────────────────────────────────────

services:
  # ── CPU mode — activate with: docker compose --profile cpu up
  omnivoice:
    image: ghcr.io/hylanderry/elevenvoice:stable
    # To build from source instead of pulling, comment out `image:` and
    # uncomment the three lines below:
    # build:
    #   context: ..
    #   dockerfile: deploy/Dockerfile
    container_name: elevenvoice
    profiles: ["cpu"]
    ports:
      - "127.0.0.1:3900:3900"
    volumes:
      - omnivoice-data:/app/elevenvoice_data
    environment:
      - HF_HOME=/app/elevenvoice_data/huggingface
      - HF_TOKEN=${HF_TOKEN:-}
      - ELEVENVOICE_DATA_DIR=/app/elevenvoice_data
      - PYTHONPATH=/app/backend
      - PYTHONUNBUFFERED=1
      # The image's uvicorn ENTRYPOINT binds 0.0.0.0 *inside* the container so
      # the host-side port mapping above can forward traffic in. The 127.0.0.1
      # prefix on the `ports:` mapping is what enforces loopback-only on the
      # host.
      # Headless server: relax the desktop-only loopback origin gate so the
      # web UI's /system/* and /api/settings/* routes work through Docker's
      # NAT (issue #261). Already baked into the image; shown here so it's
      # discoverable. If you front the container with your own auth proxy on
      # loopback, set this to 0 to re-enable the strict gate.
      - ELEVENVOICE_SERVER_MODE=1
      # Required for server-mode settings, diagnostics, and other admin
      # mutations because Docker NAT cannot prove a browser is loopback.
      - ELEVENVOICE_API_KEY=${ELEVENVOICE_API_KEY:?export a long random ELEVENVOICE_API_KEY before starting a Studio profile}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3900/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    restart: unless-stopped

  # ── GPU mode — activate with: docker compose --profile gpu up
  omnivoice-gpu:
    image: ghcr.io/hylanderry/elevenvoice:stable
    # To build from source, swap `image:` for the commented `build:` lines.
    # build:
    #   context: ..
    #   dockerfile: deploy/Dockerfile
    container_name: elevenvoice-gpu
    profiles: ["gpu"]
    ports:
      - "127.0.0.1:3900:3900"
    volumes:
      - omnivoice-data:/app/elevenvoice_data
    environment:
      - HF_HOME=/app/elevenvoice_data/huggingface
      - HF_TOKEN=${HF_TOKEN:-}
      - ELEVENVOICE_DATA_DIR=/app/elevenvoice_data
      - PYTHONPATH=/app/backend
      - PYTHONUNBUFFERED=1
      # Container-internal 0.0.0.0 bind comes from the image ENTRYPOINT — same
      # as the CPU service above. The host-side `127.0.0.1:3900:3900` mapping
      # keeps LAN reachability off by default.
      # See the CPU service above — relaxes the loopback origin gate for the
      # headless Docker deployment (issue #261). Set to 0 to re-enable it.
      - ELEVENVOICE_SERVER_MODE=1
      - ELEVENVOICE_API_KEY=${ELEVENVOICE_API_KEY:?export a long random ELEVENVOICE_API_KEY before starting a Studio profile}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3900/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  # ── AMD GPU (ROCm) mode — activate with: docker compose --profile rocm up
  # Uses the dedicated `:rocm` image variant (#1165). The GPU is passed
  # through as plain device nodes — no toolkit needed, the host only needs
  # the amdgpu kernel driver (the ROCm userspace ships inside the image).
  # Podman works with the same two --device flags (Quadlet: AddDevice=).
  omnivoice-rocm:
    image: ghcr.io/hylanderry/elevenvoice:stable-rocm
    # To build from source instead of pulling, comment out `image:` and
    # uncomment the lines below. BASE_IMAGE/GPU_FLAVOR are required — the
    # Dockerfile's defaults build the CUDA variant.
    # build:
    #   context: ..
    #   dockerfile: deploy/Dockerfile
    #   args:
    #     BASE_IMAGE: rocm/pytorch:rocm7.2.4_ubuntu24.04_py3.12_pytorch_release_2.8.0
    #     GPU_FLAVOR: rocm
    container_name: elevenvoice-rocm
    profiles: ["rocm"]
    ports:
      - "127.0.0.1:3900:3900"
    devices:
      - /dev/kfd
      - /dev/dri
    volumes:
      - omnivoice-data:/app/elevenvoice_data
    environment:
      - HF_HOME=/app/elevenvoice_data/huggingface
      - HF_TOKEN=${HF_TOKEN:-}
      - ELEVENVOICE_DATA_DIR=/app/elevenvoice_data
      - PYTHONPATH=/app/backend
      - PYTHONUNBUFFERED=1
      # See the CPU service above — relaxed loopback origin gate for the
      # headless Docker deployment.
      - ELEVENVOICE_SERVER_MODE=1
      - ELEVENVOICE_API_KEY=${ELEVENVOICE_API_KEY:?export a long random ELEVENVOICE_API_KEY before starting a Studio profile}
      # RDNA3 consumer cards (RX 7900 XTX/XT and friends, gfx1100): if the
      # GPU is not detected, uncomment the override below. The backend
      # auto-sets a same-generation value when the build lacks your card, so
      # try without it first. Never set it on RX 9000 (RDNA4) cards.
      # - HSA_OVERRIDE_GFX_VERSION=11.0.0
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3900/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
    restart: unless-stopped

volumes:
  omnivoice-data:
