# Snapcraft Builds (snapcraft.io → Builds) packages the published release.
# It repackages the official Linux .deb of the latest GitHub release, so a
# Snapcraft-built revision ships byte-identical app files to the other Linux
# installers. The release workflow (.github/workflows/snap-store.yml) remains
# the primary path; keep the interfaces below in step with the `snap-store`
# target in electron/electron-builder.config.mjs and
# docs/store-publishing/snap-store.md.
name: elevenvoice
title: ElevenVoice
summary: Local voice cloning, voice design, dubbing and dictation on your computer.
description: |
  ElevenVoice is an open-source, fully local studio for voice cloning, voice
  design, video dubbing, audiobooks and real-time dictation. Models run on
  your own machine, with no account or API key; model downloads and other
  network features run when you start them.
license: AGPL-3.0-only
website: https://voicestudio.sh
source-code: https://github.com/debpalash/VoiceStudio
issues: https://github.com/debpalash/VoiceStudio/issues
icon: snap/gui/elevenvoice.png
base: core22
grade: stable
confinement: strict
adopt-info: elevenvoice
architectures:
  - build-on: [amd64]
    build-for: [amd64]

plugs:
  browser-sandbox:
    interface: browser-support
    allow-sandbox: false

apps:
  elevenvoice:
    command: opt/ElevenVoice/elevenvoice-electron --no-sandbox
    desktop: usr/share/applications/elevenvoice.desktop
    extensions: [gnome]
    environment:
      # snapd updates the snap; the in-app updater must not.
      ELEVENVOICE_DISABLE_UPDATER: "1"
      TMPDIR: $XDG_RUNTIME_DIR
    plugs:
      - browser-sandbox
      - desktop
      - desktop-legacy
      - home
      - x11
      - wayland
      - unity7
      - network
      - network-bind
      - gsettings
      - audio-playback
      - audio-record
      - pulseaudio
      - opengl

parts:
  elevenvoice:
    plugin: nil
    build-packages: [curl, jq, dpkg]
    override-pull: |
      tag=$(curl -fsSL https://api.github.com/repos/debpalash/VoiceStudio/releases/latest | jq -r .tag_name)
      version="${tag#v}"
      craftctl set version="$version"
      curl -fsSL -o elevenvoice.deb \
        "https://github.com/debpalash/VoiceStudio/releases/download/${tag}/VoiceStudio-${version}-linux-x64.deb"
      curl -fsSL -o SHA256SUMS.txt \
        "https://github.com/debpalash/VoiceStudio/releases/download/${tag}/SHA256SUMS.txt"
      expected=$(grep " ElevenVoice-${version}-linux-x64.deb\$" SHA256SUMS.txt | cut -d' ' -f1)
      echo "${expected}  elevenvoice.deb" | sha256sum -c -
    override-build: |
      dpkg -x elevenvoice.deb "$CRAFT_PART_INSTALL"
      desktop="$CRAFT_PART_INSTALL/usr/share/applications"
      mv "$desktop/ElevenVoice.desktop" "$desktop/elevenvoice.desktop"
      sed -i -e 's|^Exec=.*|Exec=elevenvoice %U|' \
             -e 's|^Icon=.*|Icon=${SNAP}/meta/gui/elevenvoice.png|' "$desktop/elevenvoice.desktop"
      # Strict confinement cannot use the setuid sandbox helper.
      rm -f "$CRAFT_PART_INSTALL/opt/ElevenVoice/chrome-sandbox"
    stage-packages:
      - libnss3
      - libxss1
      - libasound2
      - libgbm1
      - libsecret-1-0
      - libnotify4
      - libxtst6
      - libuuid1
